[project]
name = "szu-agent"
version = "0.1.0"
description = "爱小荔：深圳大学校园事务 Agent（LangGraph + MCP，自行实现统一认证与各系统接口）"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=1.30.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qrcode>=8.2",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
szu-agent = "szu_agent.chat:main"
szu-mcp = "szu_agent.mcp_server:main"
szu-agent-web = "szu_agent.web.app:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
kb = [
    "pypdf>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
