# 真实服务（多人模式）：HTTPS 443 → 127.0.0.1:8000。
# 有域名：Let's Encrypt 证书（setup-server.sh 第二个参数给域名）；没有域名：按 IP 签发的自签名证书。
limit_req_zone $binary_remote_addr zone=real_chat:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=real_auth:10m rate=10r/m;

server {
    listen 443 ssl http2;
    server_name _;
    include /etc/nginx/conf.d/szu-cert.inc;   # 证书由 setup-server.sh 生成：域名证书或按 IP 的自签名
    ssl_protocols TLSv1.2 TLSv1.3;
    # 跨境往返贵：复用 TLS 会话，回访时握手少一个往返
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 1m;

    # 对话接口：每个 IP 每分钟 12 条，防止刷模型额度
    location ~ ^/api/(chat|resume)$ {
        limit_req zone=real_chat burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/conf.d/szu-proxy.inc;
        proxy_set_header X-Forwarded-Proto https;
    }
    # 登录接口：防止有人借这里去试学校账号的密码
    location ~ ^/api/auth/(password|mfa) {
        limit_req zone=real_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/conf.d/szu-proxy.inc;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/conf.d/szu-proxy.inc;
        proxy_set_header X-Forwarded-Proto https;
    }
}
