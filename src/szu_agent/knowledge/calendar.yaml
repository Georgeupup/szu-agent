# 深圳大学校历（结构化）
# 来源：学校官网「学校概况 → 校历」页面上的四张图片（校历说明 + 校历表），2026-11-15 手工转录。
#   https://www.szu.edu.cn/xxgk/xl.htm
# 维护：每学期新校历发布后（通常提前半年左右）在 terms 里加一项，并更新 verified_at。
#
# 周次规则（照校历表）：表格每行从“周日”排到“周六”，行首标教学周次。
#   所以周日算下一教学周的第一天：2026-03-08（周日）和 03-09（周一，开始上课）同属第一周。
#   week1_sunday = 第一教学周那一行的周日；weeks = 表里标出周次的最后一周。
#   学期开始到第一周之前（报到、缓考）、最后一周之后到学期结束，表里不标周次，这里也返回“无周次”。
source:
  title: 深圳大学校历（党政办公室、教务部）
  url: https://www.szu.edu.cn/xxgk/xl.htm
verified_at: 2026-11-15

