# 校园小巴（校内环线）和粤海↔丽湖通勤班车：静态快照
#
# 来源：“荔园小巴”网页（kpeak.szu.edu.cn，接入深大小巴公开接口的实时公交页面），2026-11-17 抓取：
#   GET {base}/api/campuses/{yuehai|lihu}/routes        线路折线 + 站点顺序（route.direction 写着“内外环未核实”）
#   GET {base}/api/routes/legacy-route:{campus}/stops   站点名 + 经纬度（腾讯地图坐标系）
#   GET https://kpeak.szu.edu.cn:8443/api/shuttle       通勤班车（页面说明“按所提供学校通知录入”）
# 实时车辆位置不在这里，campus/shuttle.py 现查。线路或站点变了就重新抓一次覆盖本文件（只改数据，不改代码）。
# 方向：两个校区都有顺时针、逆时针两个方向的车（2026-11-17 晚实时数据各 2 辆）；
#   接口的 stableDirection 和按车头朝向对照折线算出的方向基本一致，是地理意义上的顺/逆时针。
