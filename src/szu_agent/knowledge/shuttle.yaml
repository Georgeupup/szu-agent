intercampus:
  notice: 粤海与丽湖校区间通勤班车，教职工和信使人员优先乘坐。当前班次按所提供学校通知录入，周一至周五运行；法定节假日及临时调整以学校最新通知为准。时刻表预测不代表车辆实时位置。
  stops:
    - id: yuehai-huiguang
      campus: 粤海
      name: 汇光楼与汇真楼之间机动车道
      how: 汇光楼（光电子研究所）与汇真楼（实验楼）之间的机动车道。请参照图片中的红色“新乘车点”标注，勿前往黑色“原乘车点”。
      image: https://kpeak.szu.edu.cn:8443/assets/shuttle/yuehai-boarding.png  # 粤海校区新乘车点：红色为新乘车点，黑色为原乘车点。
    - id: lihu-b3
      campus: 丽湖
      name: B3文韬楼东侧（靠近惟新门）
      how: 前往 B3 文韬楼东侧，靠近惟新门乘车。
    - id: lihu-weiyi
      campus: 丽湖
      name: 惟艺门（生命与海洋科学学院一楼北侧）
      how: 前往惟艺门，生命与海洋科学学院一楼北侧乘车。13:00、17:50 在此另有一班车，请核对所选班次。
  # 发车时刻（weekdays 1=周一 … 7=周日）；行车时长接口没有给，不要估
