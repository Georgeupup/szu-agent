  - id: yh-fenghuai-101
    name: 风槐斋 101
    campus: 粤海
    kind: 室内
    hours: "9:00-21:00"
    capacity: 30
    rules: 约 170 平米，配置 32 人位自习桌椅和 30 人位可移动会议桌椅，可满足自习研讨、30 人以内会议需求。
