# 事务中心「办事百宝」工具箱（网页版，本助手还没接入的功能可以引导用户去这里办）
# note 字段不参与检索，只原样返回给模型（比如“还没录入，不要猜”）。
# 来源：用户 2026-11-14 提供的页面截图（swzx.webvpn.szu.edu.cn）；网络面试间的使用须知来自预约页截图和前端脚本 szu-booth-rule。截图底部被导航栏挡住的几项没有录入。
source:
  id: swzx-toolbox
  title: 事务中心「办事百宝」页面
  url: https://swzx.webvpn.szu.edu.cn/#/
verified_at: 2026-11-14

defaults:
  category: 办事指南
  campus: 全校
  booking:
    how: 事务中心「办事百宝」网页（校外需通过学校 WebVPN 登录）
    url_offcampus: https://swzx.webvpn.szu.edu.cn/#/

entries:
  - id: swzx-toolbox
    name: 事务中心「办事百宝」
    aliases: [事务中心工具箱, 办事百宝]
    rules: >-
      生活类：校园导览地图、资料下载、教师联系方式查询、讲解预约、荔园青年成长营、住宿申请（内网）、宣传品申请；
      缴费：校园卡充值、网费充值、电费充值；
      一站式学生社区场地预约：粤海地图、丽湖地图、体育场馆预约、学生活动场地申请、网络面试间预约、心灵小屋预约等。
      另有“学务”分类。
  - id: swzx-booth
    name: 网络面试间
    aliases: [静音舱, 静音仓, 面试间, 网络面试间预约]
    location: 各学生社区（如粤海·时光社区），具体有哪些用 booth_list 实时查
    rules: >-
      单人隔间，场地含桌子 1 张、椅子 1 把，可供 1 人进行网络面试。
      使用须知：1. 每人每日可预约 4 个时段，每个时段半小时；同一时段只能约一个静音舱。
      2. 只开放今天、明天、后天的预约，每次只能选同一天，须按时段实际开始时间至少提前两小时预约（恰好两小时允许）。
      3. 新预约时段整体提前十分钟、时长不变（如原 09:00-09:30 调整为 08:50-09:20）；已有预约保留原时间，以预约记录为准；取消后重新申请按新时段创建。
      4. 提交时须上传面试邀请凭证：邮件、短信、微信邀约截图均可，也支持 PDF、Word，共 1-5 份，单份不超过 10MB；提交后预约立即生效。
      5. 后台核查发现材料不合规将取消本次预约；一个自然月内两次材料不合规，自最后一次审核之日起 30 天内禁止预约。
      6. 请在预约时段内入场，开始后超过 15 分钟不会因此取消预约或撤销开门权限；预约结束仍未入场按爽约处理。一个自然月内三次爽约，自最后一次爽约之日起 30 天内禁止预约。
      7. 禁用期可跨月；违规次数按自然月累计，次月清零。已取消的预约不会因禁约解除而自动恢复。
      8. 使用期间爱护公用设施、保持整洁；禁止吃零食、外卖或携带含糖饮料；用完带走个人物品，丢失概不负责。
    booking:
      how: 事务中心「办事百宝」→ 网络面试间预约（选静音舱 → 同意使用须知 → 选时段 → 填手机号、年级、上传面试邀请凭证）；仅限校园网访问
      url_offcampus: https://swzx.webvpn.szu.edu.cn/#/pages/booth/szu-booth-list
  - id: swzx-piano
    name: 共享琴房
    aliases: [琴房, 练琴房, 钢琴房, 共享琴房预约]
    location: 各学生社区，具体有哪些用 booth_list（kind=琴房）实时查
    rules: >-
      和网络面试间同一个预约系统（事务中心「办事百宝」→ 共享琴房预约），半小时一格，不需要上传材料，填手机号和年级即可。
      通用规则（预约页使用须知）：每人每日可预约 4 个时段；同时段只能约一个空间；
      预约开始后 15 分钟未到场视为爽约，系统自动取消开门权限；一个自然月内三次爽约，自最后一次爽约之日起 30 天内禁止预约。
    note: 各类型的具体须知以预约页为准；助手可以直接查空闲时段并代为预约、取消。
    booking:
      how: 事务中心「办事百宝」→ 共享琴房预约（挂在学校 WebVPN 上）
      url_offcampus: https://swzx.webvpn.szu.edu.cn/#/pages/booth/szu-booth-list
  - id: swzx-meeting-room
    name: 共享会议室
    aliases: [会议室预约, 小会议室, 共享会议室预约]
    location: 各学生社区，具体有哪些用 booth_list（kind=会议室）实时查
    rules: >-
      和网络面试间同一个预约系统（事务中心「办事百宝」→ 共享会议室预约），半小时一格，不需要上传材料，填手机号和年级即可。
      通用规则：每人每日可预约 4 个时段；预约开始后 15 分钟未到场视为爽约；一个自然月内三次爽约，30 天内禁止预约。
    note: 各类型的具体须知以预约页为准；助手可以直接查空闲时段并代为预约、取消。
    booking:
      how: 事务中心「办事百宝」→ 共享会议室预约（挂在学校 WebVPN 上）
      url_offcampus: https://swzx.webvpn.szu.edu.cn/#/pages/booth/szu-booth-list
  - id: swzx-xinling
    name: 心灵小屋
    aliases: [心灵小屋预约, 心晴小屋]
    rules: 和网络面试间、共享琴房同一个预约系统（事务中心「办事百宝」→ 心灵小屋预约），助手可以查空闲时段并代为预约。
    note: 具体位置、开放时间和规则还没录入，不要猜，让用户在预约页面查看。
  - id: swzx-teacher-contact
    name: 教师联系方式查询
    aliases: [老师电话, 老师邮箱, 教师通讯录]
    rules: 在事务中心「办事百宝」→ 教师联系方式查询。
  - id: swzx-campus-map
