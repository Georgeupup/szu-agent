# 校园地图：哪些建筑在哪（粤海、丽湖）
#
# 来源：学校的两张手绘校区地图（深圳大学官微宣传图，用户 2026-11-17 提供，原图在 resource/kb-raw/，不进仓库），手工转录。
# xy：标签在图上的位置，按图片宽高归一化到 0-1000（原点左上角）。手绘图不按比例，所以不能直接当坐标用：
#   campusmap.py 用 anchors（图上的“校园小巴站”图标 ↔ shuttle.yaml 里的真实经纬度）拟合成近似经纬度。
#   精度：留一法验证（每次拿掉一个站去拟合、再看它偏多少），粤海平均约 46 米、丽湖约 64 米，最差 130 米左右。
#   够用来判断“离哪个小巴站近、大概走几分钟、在某楼的哪一侧”，不够做精确导航打点。
# 维护：
#   - 名字照抄地图；括号里的说明拆进 aka（别名）。不在图上的叫法（如“北门”）不要凭印象加，确认过才加。
#   - 地图上没写明用途的不填 note。字迹看不清的条目标 unsure: true（回答时提醒以现场为准）。
#   - 同名的（两处“A座”）保留原名，用 near 区分；检索到多个时由工具让用户选。
