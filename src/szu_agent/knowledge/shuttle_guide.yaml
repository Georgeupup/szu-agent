# 粤海校区小巴：学生经验攻略（非官方）
#
# 来源：小红书笔记《深大校内小巴最全攻略｜新生必看（超易懂版）》，用户 2026-11-17 转贴，手工整理。
#   一篇学生笔记，不是学校通知：回答时要说“据学生攻略”，票价、时间以车上和学校通知为准。
#   只讲粤海；丽湖没有对应资料，丽湖仍只用小巴接口的环线（shuttle.yaml）。
# 和接口数据的关系：
#   - 接口（shuttle.yaml）只有一条环线、14 个站，写着“内外环未核实”；攻略分内环/外环，各有两个方向，
#     而且两个方向停的站不一样（汇文楼方向不停校医院，校医院方向不停师范学院、四海楼）。规划坐车按这里的站序。
#   - 方向互相印证：按站点位置算，“校医院方向”是顺时针、“汇文楼方向”是逆时针，和接口站点顺序（逆时针 = 汇文楼方向）一致
#     （tests/test_navigation.py 守着这个对应关系）。
#   - 实时位置、到站估算仍然用接口（GPS 分不出内外环）。
# 维护：单独一个文件、手工维护，重新抓接口覆盖 shuttle.yaml 时不受影响。新学期线路变了就改这里。
source:
  id: xhs-yuehai-shuttle
  title: 深大校内小巴最全攻略｜新生必看（小红书学生笔记）
collected_at: 2026-11-17
campus: 粤海

hours: {from: "06:30", to: "23:30", note: 实际 23 点后基本没车，尽量 22:30 前坐车}
fare: 统一 1 元/人。学生可用校园卡、校园码、刷掌支付、微信；校外人员提前打开微信付款
rings:
  weekday: [内环, 外环]
  weekend: [外环]        # 周末只有外环
notes:
  - 上课高峰期内环车最多，非常密集；平时上课时段外环车更多
  - 晚上 7 点后内环车逐渐变少，基本靠外环
  - 非高峰期在北门、乔相阁、菜鸟驿站会停 5-10 分钟，定点（整点、10 分、20 分…）准时开走
tips:
  - 隐藏站点：美术馆、美术馆对面，高峰期才停，要下车上车时提前跟司机说
  - 高峰期有“荔园中巴”专门跑西南宿舍区，只在汇文楼 → 四海楼 → 乔梧阁区间下客，前面的站基本不停
  - 到北门基本全员下车，想继续坐要重新刷卡上车（看司机）
  - 开学带行李坐车可能要加钱，建议先打车到宿舍
  - 下雨天别坐两边，两侧会淋雨，尽量坐中间
  - 新车速度快、平稳、全部正向座位；旧车颠簸，最后一排是反向的

# 攻略的方向叫法 ↔ 地理方向（和小巴接口车辆的 clockwise/counterclockwise 对应）
directions:
  校医院方向: clockwise
  汇文楼方向: counterclockwise

# 攻略站名 → 位置：默认先找小巴接口的同名站（有 GPS），再找地图上的同名地点。
# 这里只写叫法不同的和位置不明的；null = 地图和接口里都没有，不拿来推荐上下车（经过时照样列在 via 里）。
stop_places:
  石头坞: 石头坞广场
  四海楼: 留学生楼          # 四海楼就是留学生宿舍楼：接口里的“留学生楼”站
  南区运动广场: 运动广场    # 接口里的“运动广场”站
  菜鸟驿站: null
  美术馆: null
  新天桥: null

# 站序（最后一站之后回到第一站）。“立德门（西门）”和“西门”是同一站，统一写西门。
lines:
  - ring: 内环
    direction: 校医院方向
    stops: [菜鸟驿站, 校医院, 石头坞, 海滨小区, 朝夕楼, 乔梧阁, 乔相阁, 西门, 听荔餐厅, 汇文楼, 汇星楼, 美术馆]
  - ring: 内环
    direction: 汇文楼方向
    stops: [聚翰斋, 美术馆, 汇星楼, 汇文楼, 师范学院, 西门, 四海楼, 乔相阁, 乔梧阁, 朝夕楼, 海滨小区, 南区运动广场, 新天桥]
  - ring: 外环
    direction: 校医院方向
    stops: [菜鸟驿站, 校医院, 石头坞, 海滨小区, 朝夕楼, 乔梧阁, 乔相阁, 西门, 听荔餐厅, 汇文楼, 汇星楼, 元平体育场, 北门, 元平体育馆, 美术馆]
  - ring: 外环
    direction: 汇文楼方向
    stops: [聚翰斋, 美术馆, 元平体育场, 北门, 元平体育馆, 汇星楼, 汇文楼, 师范学院, 西门, 四海楼, 乔相阁, 乔梧阁, 朝夕楼, 海滨小区, 南区运动广场, 新天桥]
